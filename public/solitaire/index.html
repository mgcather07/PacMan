<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klondike Solitaire</title>
  <meta name="description" content="Classic Klondike solitaire — draw 1 or draw 3, drag and drop, undo, hints and auto-complete.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#05050f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Infinite Arcade">
  <meta property="og:url" content="https://pacman-d28dc.web.app/solitaire/">
  <meta property="og:title" content="Solitaire — Infinite Arcade">
  <meta property="og:description" content="Classic Klondike Solitaire: draw 1 or 3, drag and drop, undo, hints and auto-complete.">
  <meta property="og:image" content="https://pacman-d28dc.web.app/og-card-v3.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Infinite Arcade: a Pac-Man ace of spades playing card">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Solitaire — Infinite Arcade">
  <meta name="twitter:description" content="Classic Klondike Solitaire: draw 1 or 3, drag and drop, undo, hints and auto-complete.">
  <meta name="twitter:image" content="https://pacman-d28dc.web.app/og-card-v3.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" title="Back to the arcade">⌂ <span>ARCADE</span></a>
    <div class="stats">
      <div><span>SCORE</span><b id="score">0</b></div>
      <div><span>MOVES</span><b id="moves">0</b></div>
      <div><span>TIME</span><b id="time">0:00</b></div>
    </div>
    <div class="actions">
      <select class="switch" title="Switch game" onchange="location.href=this.value"><option value="/solitaire/" selected>Klondike</option><option value="/spider/">Spider</option><option value="/freecell/">FreeCell</option></select>
      <select id="draw-mode" class="not-daily" title="Draw mode">
        <option value="1">Draw 1</option>
        <option value="3">Draw 3</option>
      </select>
      <button id="hint-btn" title="Hint (H)">💡<span> Hint</span></button>
      <button id="undo-btn" title="Undo (Ctrl+Z)">↶<span> Undo</span></button>
      <button id="new-btn" class="primary" title="New game (N)">＋<span> New</span></button>
    </div>
  </header>

  <main id="board" aria-label="Solitaire table"></main>

  <button id="auto-btn" class="auto" hidden>⚡ Auto-complete</button>

  <canvas id="celebrate" hidden></canvas>
  <div class="win" id="win" hidden>
    <div class="win-panel">
      <h2>You win!</h2>
      <div class="win-stats">
        <div><span>Score</span><b id="win-score">0</b></div>
        <div><span>Time</span><b id="win-time">0:00</b></div>
        <div><span>Moves</span><b id="win-moves">0</b></div>
      </div>
      <p id="win-record"></p>
      <button class="primary big" id="win-new">Deal again</button>
      <a class="big ghost" href="/pacman/">Play Infinite Pac-Man →</a>
    </div>
  </div>

  <script src="/shared/daily.js"></script>
  <script src="/shared/leaderboard.js"></script>
  <script src="solitaire.js"></script>
</body>
</html>
