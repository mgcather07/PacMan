<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FreeCell</title>
  <meta name="description" content="Classic FreeCell with the original numbered deals. Nearly every game can be won — can you?">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Arcade">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#05050f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Infinite Arcade">
  <meta property="og:url" content="https://pacman-d28dc.web.app/freecell/">
  <meta property="og:title" content="FreeCell">
  <meta property="og:description" content="Classic FreeCell with the original numbered deals. Nearly every game can be won — can you?">
  <meta property="og:image" content="https://pacman-d28dc.web.app/og-card-v4.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="Infinite Arcade: 32 games that never end">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FreeCell">
  <meta name="twitter:description" content="Classic FreeCell with the original numbered deals. Nearly every game can be won — can you?">
  <meta name="twitter:image" content="https://pacman-d28dc.web.app/og-card-v4.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/solitaire/style.css">
  <script src="/shared/analytics.js"></script>
  <script src="/shared/pwa.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" title="Back to the arcade">⌂ <span>ARCADE</span></a>
    <div class="stats">
      <div><span>GAME</span><b id="game-no">#1</b></div>
      <div><span>MOVES</span><b id="moves">0</b></div>
      <div><span>TIME</span><b id="time">0:00</b></div>
      <div class="hide-sm"><span>SCORE</span><b id="score">0</b></div>
      <div class="hide-sm"><span>FREE</span><b id="cells-free">4</b></div>
    </div>
    <div class="actions">
      <select class="switch" title="Switch game" onchange="location.href=this.value"><option value="/solitaire/">Klondike</option><option value="/spider/">Spider</option><option value="/freecell/" selected>FreeCell</option></select>
      <button id="choose-btn" class="not-daily" title="Pick a game number">#<span> Game</span></button>
      <button id="restart-btn" class="hide-sm" title="Restart this deal">⟲<span> Restart</span></button>
      <button id="hint-btn" title="Hint (H)">💡<span> Hint</span></button>
      <button id="undo-btn" title="Undo (Ctrl+Z)">↶<span> Undo</span></button>
      <button id="new-btn" class="primary" title="New game (N)">＋<span> New</span></button>
    </div>
  </header>

  <main id="board" aria-label="Card table"></main>
  <div id="toast" class="sol-toast"></div>

  <canvas id="celebrate" hidden></canvas>
  <div class="win" id="win" hidden>
    <div class="win-panel">
      <h2>You win!</h2>
      <div class="win-stats">
        <div><span>Score</span><b id="win-score">0</b></div>
        <div><span>Time</span><b id="win-time">0:00</b></div>
        <div><span>Moves</span><b id="win-moves">0</b></div>
      </div>
      <p id="win-record"></p>
      <button class="primary big" id="win-new">Deal again</button>
      <a class="big ghost" href="/">Back to the arcade</a>
    </div>
  </div>

  <script src="/shared/games.js"></script>
  <script src="/shared/daily.js"></script>
  <script src="/shared/leaderboard.js"></script>
  <script src="/solitaire/engine.js"></script>
  <script src="/solitaire/freecell.js"></script>
</body>
</html>
