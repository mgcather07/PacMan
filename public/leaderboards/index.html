<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboards — Infinite Arcade</title>
  <meta name="description" content="Top scores and fastest times for every game in the Infinite Arcade.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#05050f">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Infinite Arcade">
  <meta property="og:url" content="https://pacman-d28dc.web.app/leaderboards/">
  <meta property="og:title" content="Leaderboards — Infinite Arcade">
  <meta property="og:description" content="Top scores and fastest times for every game in the Infinite Arcade.">
  <meta property="og:image" content="https://pacman-d28dc.web.app/og-card-v3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://pacman-d28dc.web.app/og-card-v3.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #05050f; color: #eee; font-family: Inter, system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: clamp(24px, 5vh, 56px) 18px 48px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    .back { font: 11px "Press Start 2P", monospace; color: #9a9ab8; text-decoration: none; }
    .back:hover { color: #fff; }
    h1 { font: clamp(20px, 5vw, 40px) "Press Start 2P", monospace; color: #ffe600; text-shadow: 0 0 24px #ffe60066, 4px 4px 0 #b37400; margin: 8px 0 6px; text-align: center; line-height: 1.3; }
    .sub { text-align: center; color: #9a9ab8; margin: 0 0 22px; }
    .tabs { display: flex; justify-content: center; gap: 6px; margin: 0 auto 26px; padding: 6px; border-radius: 16px; background: #ffffff0d; border: 1px solid #ffffff1a; width: fit-content; max-width: 100%; flex-wrap: wrap; }
    .tabs button { font: 11px "Press Start 2P", monospace; color: #9a9ab8; background: transparent; border: 0; border-radius: 11px; padding: 13px 16px; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: #ffe600; color: #1b1400; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .board { background: #0b0b1d; border: 1px solid #ffffff1a; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .board header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .board h2 { margin: 0; font: 11px/1.6 "Press Start 2P", monospace; color: #fff; }
    .board .kind { font-size: 11px; color: #9a9ab8; white-space: nowrap; }
    .board ol { list-style: none; margin: 0; padding: 0; }
    .board li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 6px 2px; border-top: 1px solid #ffffff10; font-size: 14px; }
    .board li:first-child { border-top: 0; }
    .board li .rk { color: #888; font-weight: 800; }
    .board li:nth-child(1) .rk { color: #ffd700; } .board li:nth-child(2) .rk { color: #d0d8e8; } .board li:nth-child(3) .rk { color: #e0a060; }
    .board li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board li .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
    .board li.empty { display: block; color: #777; text-align: center; padding: 14px 0; }
    .board .play { margin-top: auto; align-self: flex-start; font: 10px "Press Start 2P", monospace; color: #ffe600; text-decoration: none; padding-top: 6px; }
    .namebar { max-width: 460px; margin: 0 auto 22px; }
    .board li.me { background: #ffe60022; border-radius: 6px; }
    .board li.me .nm::after { content: ' (you)'; color: #ffe600; font-size: 12px; }
    .note { text-align: center; color: #666; font-size: 13px; margin-top: 28px; }
  </style>
  <script src="/shared/analytics.js"></script>
</head>
<body>
  <main>
    <div class="top"><a class="back" href="/">⌂ ARCADE</a></div>
    <h1>🏆 LEADERBOARDS</h1>
    <p class="sub">Top 10 on every board. Finish a game to post your score — your best result on each board is kept.</p>
    <div id="namebar" class="namebar"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-group="Daily">📅 Today</button>
      <button role="tab" data-group="Infinite">∞ Infinite</button>
      <button role="tab" data-group="Classic">🏆 Classic</button>
      <button role="tab" data-group="Solitaire">🃏 Solitaire</button>
    </nav>
    <section class="grid" id="grid"></section>
    <p class="note">Scores are public. Each device plays under one anonymous player ID; names are limited to letters, numbers and simple punctuation.</p>
  </main>

  <script src="/shared/daily.js"></script>
  <script src="/shared/leaderboard.js"></script>
  <script>
    (() => {
      const { BOARDS, top, fmtTime, nameBar, user, onName, info, dailyBoards } = window.Leaderboard;
      nameBar(document.getElementById('namebar'));
      let myId = null;
      user().then((u) => { myId = u.uid; if (current) show(current); return Leaderboard.getName(); }).catch(() => {});
      onName(() => { if (current) show(current); });
      const grid = document.getElementById('grid');
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      let current = null;

      function show(group) {
        current = group;
        document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.group === group)));
        try { localStorage.setItem('arcade.lbtab', group); } catch (e) { /* ignore */ }
        history.replaceState(null, '', '#' + group.toLowerCase());
        const ids = group === 'Daily' ? dailyBoards(Daily.todayKey()) : Object.keys(BOARDS).filter((id) => BOARDS[id].group === group);
        grid.innerHTML = ids.map((id) => `
          <article class="board" data-board="${id}">
            <header><h2>${esc(info(id).title)}</h2><span class="kind">${info(id).type === 'time' ? 'fastest win' : 'high score'}</span></header>
            <ol><li class="empty">Loading…</li></ol>
            <a class="play" href="${info(id).href}">PLAY ▶</a>
          </article>`).join('');
        ids.forEach(async (id) => {
          const list = grid.querySelector(`[data-board="${id}"] ol`);
          try {
            const entries = await top(id, 10);
            if (current !== group) return;
            list.innerHTML = entries.length
              ? entries.map((e, i) => `<li class="${e.id === myId ? 'me' : ''}"><span class="rk">#${i + 1}</span><span class="nm">${esc(e.name)}</span><span class="sc">${info(id).type === 'time' ? fmtTime(e.time) : e.score.toLocaleString()}</span></li>`).join('')
              : '<li class="empty">No scores yet — be the first!</li>';
          } catch (e) {
            list.innerHTML = '<li class="empty">Unavailable right now</li>';
          }
        });
      }

      document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.group)));
      const fromHash = { '#daily': 'Daily', '#infinite': 'Infinite', '#classic': 'Classic', '#solitaire': 'Solitaire' }[location.hash];
      let saved = null;
      try { saved = localStorage.getItem('arcade.lbtab'); } catch (e) { /* ignore */ }
      show(fromHash || (['Daily', 'Infinite', 'Classic', 'Solitaire'].includes(saved) ? saved : 'Infinite'));
    })();
  </script>
  <script src="/shared/music.js"></script>
  <script>ArcadeMusic.mount();</script>
</body>
</html>
